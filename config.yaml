base_currency: EUR

benchmark:
  name: "FTSE All-World (proxy ETF)"
  isin: IE00BK5BQT80          # verify; or MSCI World IE00B4L5Y983
  ticker: VWCE.DE             # verify listing before relying on it

# Optional per ISIN: ticker (Yahoo Finance symbol), short (display name),
# class (drives the asset-class donut; unset -> shown as "Nicht zugeordnet").
# No ticker is fine: docs/dev/refactor-concept.md §2.3 derives an "implied"
# price from the ISIN's own buy/sell amounts for any ISIN ever held — you
# do NOT need to source a real ticker for old, fully-sold-out positions.
# `uv run etf-portfolio --list-instruments` lists every ISIN ever traded
# plus its current ticker/class/coverage status.
# Verified live against the Yahoo Finance chart API (2026-10-05).
instruments:
  IE000I8KRLL9:
    {ticker: "SEC0.DE", short: "iShares MSCI Global Semiconductors", class: ETF}
  FR001400YYJ0:
    {ticker: "FINZ.DE", short: "finanzen.net MSCI World", class: ETF}
  IE00BF4RFH31:
    {ticker: "IUSN.DE", short: "iShares MSCI World Small Cap", class: ETF}
  IE000N7LUK04:
    {ticker: "QQCC.DE", short: "Boreas Solactive Quantum Computing", class: ETF}

goal:
  monthly_saving: 700
  years: 10
  inflation: 0.02
  withdraw_until_age: 85
  birth_year: null

reconcile:
  cash_check: {date: null, balance: null}
  positions: {}

overrides: []
