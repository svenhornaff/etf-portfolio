base_currency: EUR

benchmark:
  name: "FTSE All-World (proxy ETF)"
  isin: IE00BK5BQT80          # verify; or MSCI World IE00B4L5Y983
  ticker: VWCE.DE             # verify listing before relying on it

# Instrument reference data (ticker/short/class/TER/region/sector/...)
# moved to instruments.yaml — docs/dev/report-v3-concept.md §6. This file
# stays settings-only: how the report is built, not what each fund is.

# docs/dev/report-v3-concept.md §3 health-check traffic lights. All
# thresholds are yours to tune; the report never recommends trades, only
# shows the deviation against these targets.
targets:
  allocation: {core: 0.70, satellite: 0.30}
  band_pp: 5
  max_position: 0.35
  max_ter: 0.0025
  target_wealth_10y: 150000

# For Sharpe/Sortino — a fixed proxy since there's no live €STR feed here.
# 2 % reflects short-term EUR money-market yields over the 2024-2026
# period this report covers; revisit if that regime changes.
risk_free:
  source: fixed
  rate: 0.02

goal:
  monthly_saving: 700
  years: 10
  inflation: 0.02
  withdraw_until_age: 85
  birth_year: null

reconcile:
  cash_check: {date: null, balance: null}
  positions: {}

overrides: []
