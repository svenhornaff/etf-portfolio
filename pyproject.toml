[project]
name = "etf-portfolio"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sven Hornaff", email = "sven.hornaff@t-systems.com" }
]
requires-python = ">=3.12.13"
dependencies = [
    "jinja2>=3.1.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
etf-portfolio = "etf_portfolio.report:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["etf_portfolio", "tests"]
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
